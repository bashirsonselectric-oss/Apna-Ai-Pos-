    <script>
      // 1. Detect uncompiled root index.html on GitHub Pages and redirect to pre-built /docs/
      (function() {
        var isGitHub = window.location.hostname.endsWith('github.io');
        var path = window.location.pathname;
        var isCompiled = document.querySelector('script[src*="assets/index"]');
        if (isGitHub && !isCompiled && !path.includes('/docs')) {
          var target = path.endsWith('/') ? path + 'docs/' : path + '/docs/';
          window.location.replace(target + window.location.search + window.location.hash);
          return;
        }

        // 2. Ensure trailing slash on GitHub Pages repository root for correct relative asset resolution
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
      // 3. SPA redirect handler from 404.html for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
