    <meta property="og:description" content="Commercial multi-store cloud & offline Point of Sale, Udhar Khatta, and intelligent inventory system with AI bill scanning and Urdu auto-fill." />

    <meta name="theme-color" content="#141414" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        var isGitHub = window.location.hostname.endsWith('github.io');
        var path = window.location.pathname;
        var isCompiled = document.querySelector('script[src*="assets/index"]');
        if (isGitHub && !isCompiled && !path.includes('/docs')) {
          var target = path.endsWith('/') ? path + 'docs/' : path + '/docs/';
          window.location.replace(target + window.location.search + window.location.hash);
          return;
        }
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root">
      <div id="loading-fallback" style="min-height:100vh;background:#faf7f4;color:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="width:52px;height:52px;border-radius:14px;background:#141414;color:#faf7f4;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:20px;margin-bottom:16px;">
          A
        </div>
        <h2 style="font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-0.01em;margin:0 0 6px 0;">Apna Boutique POS</h2>
        <p style="font-size:13px;color:#6b625b;margin:0 0 16px 0;max-width:320px;">Preparing luxury retail counter & offline catalog...</p>
        <div style="width:140px;height:2px;background:#e8e0d8;border-radius:99px;overflow:hidden;">
          <div style="width:60%;height:100%;background:#141414;border-radius:99px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
